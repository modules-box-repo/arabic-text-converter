<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>محول النص العربي</title>
<script src="js/theme.js"></script>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
</head>
<body>
<svg class="sprite" aria-hidden="true">
  <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M2.5 12h2.6M18.9 12h2.6M5.2 5.2l1.9 1.9M16.9 16.9l1.9 1.9M18.8 5.2l-1.9 1.9M7.1 16.9l-1.9 1.9"/></symbol>
  <symbol id="i-moon" viewBox="0 0 24 24"><path d="M20 14.4A8.4 8.4 0 0 1 9.6 4a8.4 8.4 0 1 0 10.4 10.4Z"/></symbol>
  <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2.5"/><path d="M15 5.5A2.5 2.5 0 0 0 12.5 3H6.5A2.5 2.5 0 0 0 4 5.5v6A2.5 2.5 0 0 0 6.5 14"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><path d="M4.5 12.5 10 18 19.5 6.5"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4.5 6.5h15M9.5 6.5V4.8A1.3 1.3 0 0 1 10.8 3.5h2.4a1.3 1.3 0 0 1 1.3 1.3v1.7M6.5 6.5l.9 12.2A1.8 1.8 0 0 0 9.2 20.5h5.6a1.8 1.8 0 0 0 1.8-1.8l.9-12.2"/></symbol>
</svg>

<header class="toolbar">
  <a class="brand" href="/">
    <span class="brand-text">
      <strong data-i18n="app.title">محول النص العربي</strong>
      <small data-i18n="app.tagline">إصلاح العربية لتطبيقات التصميم</small>
    </span>
  </a>
  <div class="toolbar-actions">
    <button class="icon-btn" id="themeToggle" type="button" title="Toggle theme" aria-label="Toggle theme" aria-pressed="false">
      <svg class="icon icon-sun"><use href="#i-sun"/></svg>
      <svg class="icon icon-moon"><use href="#i-moon"/></svg>
    </button>
  </div>
</header>

<main class="page">
  <section class="workspace">
    <article class="panel">
      <header class="panel-head">
        <h2 data-i18n="panel.input">النص الأصلي</h2>
        <div class="panel-tools">
          <button class="ghost-btn" id="clearBtn" type="button">
            <svg class="icon"><use href="#i-trash"/></svg>
            <span data-i18n="panel.clear">مسح</span>
          </button>
        </div>
      </header>
      <textarea id="input" spellcheck="false" dir="auto" data-i18n-placeholder="panel.placeholder" placeholder="ادخل نصا هنا"></textarea>
    </article>

    <article class="panel">
      <header class="panel-head">
        <h2 data-i18n="panel.output">النص المحوّل</h2>
        <div class="panel-tools">
          <button class="ghost-btn" id="copyBtn" type="button">
            <svg class="icon icon-copy"><use href="#i-copy"/></svg>
            <svg class="icon icon-check"><use href="#i-check"/></svg>
            <span data-i18n="panel.copy">نسخ</span>
          </button>
        </div>
      </header>
      <textarea id="output" readonly spellcheck="false" dir="ltr" placeholder=""></textarea>
    </article>
  </section>
</main>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
</body>
</html>
